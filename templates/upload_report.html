<h2>Upload Report for {{ patient.name }}</h2>

  {% if error %}
  <p style="color:red;">{{ error }}</p>
  {% endif %}

  <form method="POST" enctype="multipart/form-data" id="upload-report-form">
      {% csrf_token %}

      <label>Report Type:</label>
      <select name="report_type" required>
          <option value="xray">X-Ray</option>
          <option value="blood_test">Blood Test</option>
          <option value="scan">Scan</option>
          <option value="other">Other</option>
      </select>

      <br><br>

      <label>Title:</label>
      <input type="text" name="title" required>

      <br><br>

      <label>File:</label>
      <input type="file" name="file" required>

      <br><br>

      <button type="submit" id="upload-submit-btn">Upload Report</button>
  </form>

  <!-- NEW: loading indicator, hidden by default -->
  <div id="upload-loading" style="display:none; margin-top:14px; padding:12px; background:#eef5ff; border:1px solid #b8d4f5; border-radius:6px; color:#1f5fbf; font-weight:600;">
      ⏳ Uploading and analyzing report... this may take a few seconds. Please don't close or refresh this page.
  </div>
  <!-- END NEW -->

  <br>

  <a href="/doctor-dashboard/" id="back-link">Back</a>

  <!-- NEW: script to show loading state on submit -->
  <script>
      document.getElementById('upload-report-form').addEventListener('submit', function () {
          document.getElementById('upload-submit-btn').disabled = true;
          document.getElementById('upload-submit-btn').textContent = 'Uploading...';
          document.getElementById('upload-loading').style.display = 'block';
      });
  </script>
  <!-- END NEW -->
