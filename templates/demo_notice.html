<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo QR Code</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            padding: 20px;
        }

        .notice-card {
            width: min(440px, 100%);
            text-align: center;
            padding: 40px 28px;
            background: #ffffff;
            border: 1px solid #d9e1ec;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }

        .icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #eef5ff;
            color: #1f5fbf;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 19px;
        }

        p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="notice-card">
        <div class="icon">&#9432;</div>
        <h1>Demo QR Code</h1>
        <p>
            This QR code was generated for portfolio demonstration purposes only.
            The simulated patient record has since been removed to protect privacy,
            so no data is linked to this code anymore.
        </p>
    </div>
</body>
</html>
