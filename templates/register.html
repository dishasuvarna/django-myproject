<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }

        .container {
            width: 350px;
            margin: 80px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
        }

        a {
            display: block;
            margin-top: 10px;
        }
       .password-wrapper {
            position: relative;
            width: calc(90% + 20px);
            margin: 10px;
            box-sizing: border-box;
        }

        .password-wrapper input {
             width: 100%;
             padding: 8px;
             padding-right: 40px;
             margin: 0;
             box-sizing: border-box;
            }

        .eye-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            display: flex;
            align-items: center;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Patient Registration</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Username" required value="{{ username }}">
    <div class="password-wrapper">
            <input name="password" type="password" id="login-password" placeholder="Enter Password" required value="{{ password }}">
            <span class="eye-icon" onclick="togglePasswordVisibility('login-password', this)">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </span>
        </div>
    <input type="password" name="phone" placeholder="Phone" required value="{{ phone }}">

    <!-- SEND OTP -->
    <button type="submit" name="action" value="send_otp">Send OTP</button>

    <!-- SHOW AFTER OTP -->
    {% if otp_sent %}
        <input type="password" name="otp" placeholder="Enter OTP" required>
        <button type="submit" name="action" value="verify_otp">Register</button>
    {% endif %}

</form>
    <a href="/login/">Already have an account? Login</a>
</div>
<script>
    function togglePasswordVisibility(inputId, iconEl) {
        const input = document.getElementById(inputId);
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';

        // swap icon: open eye <-> eye with slash
        iconEl.innerHTML = isHidden
            ? '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
            : '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }
</script>
</body>
</html>
