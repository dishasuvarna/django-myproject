<div style="max-width: 380px; margin: 30px auto; padding: 24px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; font-family: Arial, sans-serif; text-align: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
    
    <h2 style="margin: 0 0 16px 0; font-size: 20px; color: #111827;">Your QR Code</h2>

    <div style="padding: 12px; background: #f9fafb; border: 1px solid #f3f4f6; border-radius: 8px; display: inline-block; margin-bottom: 12px;">
        <img src="{{ qr }}" width="180" style="display: block; border-radius: 4px;">
    </div>

    <p style="margin: 0 0 16px 0; font-size: 14px; color: #4b5563;">Scan this QR to access your medical details</p>

    <div style="margin-bottom: 20px; font-size: 14px; color: #1f2937; background: #f3f4f6; padding: 8px 12px; border-radius: 6px; display: inline-block;">
        <b>Patient Code:</b> {{ patient.patient_code }}
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
        <a href="{{ qr }}" download style="text-decoration: none;">
            <button style="width: 100%; padding: 10px; font-size: 14px; font-weight: 500; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer;">Download QR</button>
        </a>

        <a href="/my-prescriptions/" style="text-decoration: none;">
            <button style="width: 100%; padding: 10px; font-size: 14px; font-weight: 500; background: #4b5563; color: white; border: none; border-radius: 6px; cursor: pointer;">View My Prescriptions</button>
        </a>
    </div>

    <div style="margin-top: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
        <a href="/login/" style="color: #2563eb; text-decoration: none;">Back to Login</a>
        <a href="/logout/" style="text-decoration: none;">
            <button style="padding: 6px 12px; font-size: 13px; background: #fee2e2; color: #b91c1c; border: none; border-radius: 4px; cursor: pointer;">Logout</button>
        </a>
    </div>

</div>
