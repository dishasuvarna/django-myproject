<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Emergency QR System</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .landing-card {
            width: min(420px, calc(100% - 32px));
            text-align: center;
            padding: 40px 28px;
            background: #ffffff;
            border: 1px solid #d9e1ec;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }

        .checkmark {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #e6f4ea;
            color: #0f766e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        p.subtitle {
            margin: 0 0 28px;
            color: #6b7280;
            font-size: 14px;
        }

        .role-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .role-button {
            display: block;
            padding: 14px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            border: 1px solid transparent;
        }

        .role-button.doctor {
            background: #1f5fbf;
            color: #ffffff;
        }

        .role-button.doctor:hover {
            background: #174a95;
        }

        .role-button.patient {
            background: #ffffff;
            color: #1f2937;
            border-color: #d9e1ec;
        }

        .role-button.patient:hover {
            background: #f8fafc;
        }
    </style>
</head>
<body>
    <div class="landing-card">
        <div class="checkmark">&#10003;</div>
        <h1>Smart Emergency QR System</h1>
        <p class="subtitle">Fast, secure access to critical medical information.</p>

        <div class="role-buttons">
            <a class="role-button doctor" href="{% url 'doctor_login' %}">I'm a Doctor</a>
            <a class="role-button patient" href="{% url 'login' %}">I'm a Patient</a>
        </div>
    </div>
</body>
</html>
